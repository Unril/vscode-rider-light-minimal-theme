name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request makes its running check obsolete; runs on master always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # uv fails instead of rewriting uv.lock, so a stale lockfile cannot pass.
  UV_LOCKED: '1'

jobs:
  test:
    runs-on: ubuntu-slim
    # ubuntu-slim cuts jobs off at 15 minutes; fail earlier with a clear timeout instead.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: '^1.58'
      # Every check, regeneration and vsce packaging: a manifest or .vscodeignore mistake fails here, not in Publish.
      - name: Test, regenerate and package
        run: just package
      # Catches stale generated files and a basedpyright baseline that shrank but was not committed.
      - name: Check the working tree is unchanged
        run: git diff --exit-code
